<html>

<head>
    <title>URL shortner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <h1> URL Shortner</h1>
            <form id="url-shorten-form">
                <div class="formElements">
                    <diV>
                        <label class='form-label' for="url">Enter URL</label>
                        <input type="url" name="url" id="url">
                    </diV>
                    <div>
                        <label for="shortCode">Enter short code</label>
                        <input type="text" name="shortCode" id="shortCode">
                    </div>
                </div>
                <button class="submitBtn" type="submit">Submit</button>
            </form>
            <div>
                <h1>Shortened URL's </h1>
                <div id="shortened-url">

                </div>
            </div>
        </div>
    </div>
    <script>

        const fetchShortenedData = async () => {
            try {
                const currentUrl = window.location.href;
                const shoternedUrlData = await fetch(`/get-shortened-url`, {
                    method: 'Get'
                });
                //const shortenedUrlFormattedData = await shoternedUrlData.json();
                //const shortenedUrlFormattedDataObj = await JSON.parse(shortenedUrlFormattedData);

                const shortenedUrlFormattedDataObj = await shoternedUrlData.json();
                console.log('@@@ shoternedUrlData res', typeof shortenedUrlFormattedDataObj);
                const list = document.getElementById('shortened-url');
                list.innerHTML = '';
                for (const [shortCode, url] of Object.entries(shortenedUrlFormattedDataObj)) {
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="/${shortCode}" target="_blank">${window.location.origin}/${shortCode}</a> ---> ${url}`;
                    list.appendChild(li);
                }
            } catch (err) {
                console.log('@@@ error while fetching the shortened urls', err);
            }
        }

        document.getElementById('url-shorten-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            console.log('@@@ url shortened form event', event.target);
            const formData = new FormData(event.target);
            console.log('@@@ form data', formData);
            const url = formData.get('url');
            const shortCode = formData.get('shortCode');
            const payload = { url: url, shortCode: shortCode };
            console.log('@@@ url shortCode', url, shortCode);
            const currentUrl = window.location.href;
            const apiData = await fetch(`/save-shortenLink`, {
                method: 'POST',
                headers: { 'Content-type': 'application/json' },
                body: JSON.stringify(payload),
                //body: payload,
            });
            console.log('@@@ data from backend', apiData);
            if (apiData?.status === 200) {
                fetchShortenedData();
                alert('form submiitted successfully');
                event.target.reset();
            }
            else {
                const errMessage = await apiData.text();
                alert(errMessage);
            }
        });

        fetchShortenedData();

    </script>
</body>

</html>
